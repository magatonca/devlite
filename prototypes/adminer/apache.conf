# PROTÓTIPO: não habilitado. Porta 80 existente preservada.
Listen 127.0.0.1:8081
Listen [::1]:8081
<VirtualHost 127.0.0.1:8081 [::1]:8081>
    ServerName localhost
    DocumentRoot /usr/share/devlite-os/adminer/empty
    SetEnvIfNoCase Host "^(127\.0\.0\.1|\[::1\]|localhost):8081$" devlite_adminer_host_ok
    Alias "/devlite-adminer" "/usr/share/devlite-os/adminer/index.php"
    <Directory "/usr/share/devlite-os/adminer">
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>
    <LocationMatch "^/devlite-adminer/?$">
        <RequireAll>
            Require ip 127.0.0.1 ::1
            Require env devlite_adminer_host_ok
        </RequireAll>
    </LocationMatch>
    <LocationMatch "^/adminer(?:/|$)">
        Require all denied
    </LocationMatch>
    <Directory "/etc/adminer">
        Require all denied
    </Directory>
    <Directory "/usr/share/adminer">
        Require all denied
    </Directory>
</VirtualHost>
